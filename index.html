
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Harga Tayang</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            margin: 0;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 600px;
            margin: 20px auto;
            padding: 25px;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        h1 {
            text-align: center;
            color: #176b45;
            font-size: 25px;
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-top: 16px;
            margin-bottom: 7px;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 16px;
            background: #fff;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #198754;
        }

        .hasil {
            margin-top: 25px;
            padding: 18px;
            background: #eaf7ef;
            border-radius: 9px;
        }

        .hasil h2 {
            margin-top: 0;
            font-size: 20px;
            color: #176b45;
        }

        .baris-hasil {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            margin: 12px 0;
            font-size: 15px;
        }

        .baris-hasil span:last-child {
            text-align: right;
            font-weight: bold;
        }

        .total {
            border-top: 1px solid #b8ddc5;
            padding-top: 14px;
            margin-top: 15px;
            color: #176b45;
            font-size: 18px;
        }

        .tombol {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 7px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-reset {
            background: #e5e7eb;
            color: #333;
        }

        .btn-reset:hover {
            background: #d1d5db;
        }

        .footer {
            text-align: center;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #eee;
            color: #555;
        }

        .footer .contact-question {
            font-size: 17px;
            line-height: 1.5;
            font-weight: bold;
            margin-bottom: 7px;
        }

        .footer .contact-instruction {
            font-size: 15px;
            line-height: 1.5;
            margin-bottom: 7px;
        }

        .footer .contact-link {
            display: inline-block;
            font-size: 18px;
            line-height: 1.5;
            font-weight: bold;
            color: #198754;
            text-decoration: none;
        }

        .footer .contact-link:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            body {
                padding: 12px;
            }

            .container {
                padding: 18px;
                margin: 10px auto;
            }

            h1 {
                font-size: 22px;
            }

            .baris-hasil {
                font-size: 14px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Kalkulator Harga Tayang</h1>

        <label for="hargaDasar">Harga Dasar (Rp)</label>
        <input
            type="text"
            id="hargaDasar"
            placeholder="Contoh: 2.000.000"
            inputmode="numeric"
            autocomplete="off"
            oninput="formatHarga(this)"
        >

        <label for="jenisPajak">Jenis Pajak</label>
        <select id="jenisPajak" onchange="hitung()">
            <option value="ppn12">PPN 12%</option>
            <option value="pajakDaerah">Pajak Daerah 10%</option>
        </select>

        <label for="jenisBarang">Jenis Pengadaan</label>
        <select id="jenisBarang" onchange="hitung()">
            <option value="barang">Barang (PPh 1,5%)</option>
            <option value="jasa">Jasa (PPh 23 sebesar 2%)</option>
        </select>

        <div class="hasil">
            <h2>Hasil Perhitungan</h2>

            <div class="baris-hasil">
                <span>Harga Dasar</span>
                <span id="hasilHargaDasar">Rp0</span>
            </div>

            <div class="baris-hasil">
                <span>Pajak</span>
                <span id="hasilPajak">Rp0</span>
            </div>

            <div class="baris-hasil">
                <span>PPh</span>
                <span id="hasilPph">Rp0</span>
            </div>

            <div class="baris-hasil">
                <span>Subtotal</span>
                <span id="hasilSubtotal">Rp0</span>
            </div>

            <div class="baris-hasil">
                <span>Fee Marketplace (0,5%)</span>
                <span id="hasilFee">Rp0</span>
            </div>

            <div class="baris-hasil total">
                <span>Harga Tayang</span>
                <span id="hasilTotal">Rp0</span>
            </div>
        </div>

        <div class="tombol">
            <button type="button" class="btn-reset" onclick="resetKalkulator()">
                Reset
            </button>
        </div>

        <div class="footer">
            <div class="contact-question">
                Ada saran atau pertanyaan?
            </div>

            <div class="contact-instruction">
                Silakan hubungi:
            </div>

            <a
                class="contact-link"
                href="https://wa.me/6281125213879"
                target="_blank"
                rel="noopener noreferrer"
            >
                081125213879 (Egik)
            </a>
        </div>
    </div>

    <script>
        // Format angka dengan titik pemisah ribuan
        function formatHarga(input) {
            const angka = input.value.replace(/\D/g, "");

            input.value = angka
                ? Number(angka).toLocaleString("id-ID")
                : "";

            hitung();
        }

        // Format angka menjadi Rupiah
        function formatRupiah(angka) {
            return "Rp" + Math.round(angka).toLocaleString("id-ID");
        }

        // Menghitung harga tayang
        function hitung() {
            const nilaiInput = document.getElementById("hargaDasar")
                .value.replace(/\./g, "");

            const hargaDasar = Number(nilaiInput) || 0;

            const jenisPajak =
                document.getElementById("jenisPajak").value;

            const jenisBarang =
                document.getElementById("jenisBarang").value;

            let pajak = 0;
            let pph = 0;

            // Perhitungan pajak
            if (jenisPajak === "ppn12") {
                pajak = hargaDasar * 0.12;
            } else if (jenisPajak === "pajakDaerah") {
                pajak = hargaDasar * 0.10;
            }

            // Perhitungan PPh
            if (jenisBarang === "barang") {
                pph = hargaDasar * 0.015;
            } else if (jenisBarang === "jasa") {
                pph = hargaDasar * 0.02;
            }

            const subtotal = hargaDasar + pajak + pph;
            const fee = subtotal * 0.005;
            const total = subtotal + fee;

            // Tampilkan hasil
            document.getElementById("hasilHargaDasar").textContent =
                formatRupiah(hargaDasar);

            document.getElementById("hasilPajak").textContent =
                formatRupiah(pajak);

            document.getElementById("hasilPph").textContent =
                formatRupiah(pph);

            document.getElementById("hasilSubtotal").textContent =
                formatRupiah(subtotal);

            document.getElementById("hasilFee").textContent =
                formatRupiah(fee);

            document.getElementById("hasilTotal").textContent =
                formatRupiah(total);
        }

        // Reset kalkulator
        function resetKalkulator() {
            document.getElementById("hargaDasar").value = "";
            document.getElementById("jenisPajak").selectedIndex = 0;
            document.getElementById("jenisBarang").selectedIndex = 0;

            hitung();
        }

        // Tampilkan hasil awal saat halaman dibuka
        hitung();
    </script>
</body>
</html>
