
<script>
/* =========================================================
   NAVIGASI DRAWER MOBILE
========================================================= */

const menuToggle = document.getElementById("menuToggle");
const navDrawer = document.getElementById("navDrawer");
const navOverlay = document.getElementById("navOverlay");

function bukaMenu() {
    menuToggle.classList.add("active");
    navDrawer.classList.add("show");
    navOverlay.classList.add("show");
    document.body.style.overflow = "hidden";
}

function tutupMenu() {
    menuToggle.classList.remove("active");
    navDrawer.classList.remove("show");
    navOverlay.classList.remove("show");
    document.body.style.overflow = "";
}

if (menuToggle) {
    menuToggle.addEventListener("click", () => {
        navDrawer.classList.contains("show") ? tutupMenu() : bukaMenu();
    });
}

if (navOverlay) {
    navOverlay.addEventListener("click", tutupMenu);
}

/* =========================================================
   DARK MODE
========================================================= */

const darkModeToggle = document.getElementById("darkModeToggle");
const desktopDarkModeToggle = document.getElementById("desktopDarkModeToggle");
const darkModeIcon = document.getElementById("darkModeIcon");
const desktopDarkModeIcon = document.getElementById("desktopDarkModeIcon");
const darkModeText = document.getElementById("darkModeText");
const desktopDarkModeText = document.getElementById("desktopDarkModeText");

function aturDarkMode(aktif) {
    document.body.classList.toggle("dark-mode", aktif);

    const icon = aktif ? "☀️" : "🌙";
    const text = aktif ? "Light Mode" : "Dark Mode";

    if (darkModeIcon) darkModeIcon.textContent = icon;
    if (desktopDarkModeIcon) desktopDarkModeIcon.textContent = icon;
    if (darkModeText) darkModeText.textContent = text;
    if (desktopDarkModeText) desktopDarkModeText.textContent = text;

    try {
        localStorage.setItem(
            "kalkulatorDarkMode",
            aktif ? "aktif" : "nonaktif"
        );
    } catch (e) {}
}

let darkModeTersimpan = false;

try {
    darkModeTersimpan =
        localStorage.getItem("kalkulatorDarkMode") === "aktif";
} catch (e) {}

aturDarkMode(darkModeTersimpan);

if (darkModeToggle) {
    darkModeToggle.addEventListener("click", () => {
        aturDarkMode(!document.body.classList.contains("dark-mode"));
        tutupMenu();
    });
}

if (desktopDarkModeToggle) {
    desktopDarkModeToggle.addEventListener("click", () => {
        aturDarkMode(!document.body.classList.contains("dark-mode"));
    });
}

/* =========================================================
   MODAL PROFIL
========================================================= */

const profileTrigger = document.getElementById("profileTrigger");
const sidebarUserTrigger = document.getElementById("sidebarUserTrigger");
const profileModal = document.getElementById("profileModal");
const closeModal = document.getElementById("closeModal");
const profileInput = document.getElementById("profileInput");
const btnDeletePhoto = document.getElementById("btnDeletePhoto");

const MAX_PHOTO_SIZE = 200 * 1024;

function bukaModal() {
    profileModal.classList.add("show");
}

function tutupModal() {
    profileModal.classList.remove("show");
}

if (profileTrigger) {
    profileTrigger.addEventListener("click", bukaModal);
}

if (sidebarUserTrigger) {
    sidebarUserTrigger.addEventListener("click", bukaModal);
}

if (closeModal) {
    closeModal.addEventListener("click", tutupModal);
}

if (profileModal) {
    profileModal.addEventListener("click", function(e) {
        if (e.target === profileModal) {
            tutupModal();
        }
    });
}

/* =========================================================
   MENAMPILKAN FOTO PROFIL
========================================================= */

function pasangFotoProfil(photoUrl) {
    const ids = [
        "headerProfileImg",
        "modalPreviewImg",
        "sidebarUserAvatarImg"
    ];

    const icons = [
        "headerProfileIcon",
        "modalPreviewIcon",
        "sidebarUserAvatarIcon"
    ];

    if (photoUrl) {
        ids.forEach(id => {
            const el = document.getElementById(id);

            if (el) {
                el.src = photoUrl;
                el.style.display = "block";
            }
        });

        icons.forEach(id => {
            const el = document.getElementById(id);

            if (el) {
                el.style.display = "none";
            }
        });
    } else {
        ids.forEach(id => {
            const el = document.getElementById(id);

            if (el) {
                el.removeAttribute("src");
                el.style.display = "none";
            }
        });

        icons.forEach(id => {
            const el = document.getElementById(id);

            if (el) {
                el.style.display = "block";
            }
        });
    }
}

/* =========================================================
   MEMANGGIL API FOTO PROFIL DI REDIS
========================================================= */

async function kirimFotoKeServer(pictureAction, picture) {
    const body = {
        action: "profile-photo",
        pictureAction: pictureAction
    };

    if (pictureAction === "save") {
        body.picture = picture;
    }

    const response = await fetch("/api/user/login", {
        method: "POST",
        credentials: "same-origin",
        headers: {
            "Content-Type": "application/json",
            "Accept": "application/json"
        },
        body: JSON.stringify(body)
    });

    let data;

    try {
        data = await response.json();
    } catch {
        throw new Error("Respons server tidak dapat dibaca.");
    }

    if (response.status === 401) {
        window.location.replace("/login-user.html");
        throw new Error("Sesi berakhir. Silakan login kembali.");
    }

    if (!response.ok || !data.success) {
        throw new Error(
            data.message || "Permintaan foto profil gagal."
        );
    }

    return data;
}

/* =========================================================
   VERIFIKASI SESI DAN MEMUAT DATA PENGGUNA
========================================================= */

async function muatDataUser() {
    const loader = document.getElementById("authLoader");

    try {
        const res = await fetch("/api/user/login?action=check", {
            method: "GET",
            credentials: "same-origin",
            cache: "no-store",
            headers: {
                "Accept": "application/json"
            }
        });

        if (!res.ok) {
            window.location.replace("/login-user.html");
            return;
        }

        const data = await res.json();

        if (!data.authenticated || !data.user) {
            window.location.replace("/login-user.html");
            return;
        }

        const user = data.user;

        if (user.name) {
            const greeting = document.getElementById("greetingTitle");
            const modalUser = document.getElementById("modalUserName");
            const sidebarUser = document.getElementById("sidebarUserName");

            if (greeting) {
                greeting.textContent = `Selamat datang, ${user.name}!`;
            }

            if (modalUser) {
                modalUser.textContent = user.name;
            }

            if (sidebarUser) {
                sidebarUser.textContent = user.name;
            }
        }

        if (user.email) {
            const emailEl = document.getElementById("modalUserEmail");

            if (emailEl) {
                emailEl.textContent = user.email;
            }
        }

        /*
         * Foto dibaca dari Redis melalui API check.
         * Tidak lagi menggunakan localStorage sebagai penyimpanan foto.
         */
        pasangFotoProfil(user.picture || "");

        if (loader) {
            loader.style.opacity = "0";

            setTimeout(() => {
                loader.style.display = "none";
            }, 300);
        }

    } catch (err) {
        console.error("Gagal memuat sesi pengguna:", err);

        if (loader) {
            loader.style.display = "flex";
            loader.style.opacity = "1";
        }

        // Jika server sementara bermasalah, jangan langsung
        // menghapus sesi atau mengarahkan pengguna keluar.
        const loaderText = loader
            ? loader.querySelector("span")
            : null;

        if (loaderText) {
            loaderText.textContent =
                "Gagal terhubung. Muat ulang halaman untuk mencoba lagi.";
        }
    }
}

/* =========================================================
   PILIH DAN SIMPAN FOTO KE REDIS
========================================================= */

if (profileInput) {
    profileInput.accept = "image/jpeg,image/png,image/webp";

    profileInput.addEventListener("change", async function() {
        const file = this.files && this.files[0];

        if (!file) return;

        const allowedTypes = [
            "image/jpeg",
            "image/png",
            "image/webp"
        ];

        if (!allowedTypes.includes(file.type)) {
            alert("Format foto harus JPG, PNG, atau WebP.");
            this.value = "";
            return;
        }

        if (file.size > MAX_PHOTO_SIZE) {
            alert("Ukuran foto maksimal 200 KB. Silakan pilih foto yang lebih kecil.");
            this.value = "";
            return;
        }

        if (file.size === 0) {
            alert("File foto kosong atau tidak valid.");
            this.value = "";
            return;
        }

        const tombolPilih = document.querySelector(
            '.btn-primary-modal'
        );

        const teksAwal = tombolPilih
            ? tombolPilih.textContent
            : "";

        if (tombolPilih) {
            tombolPilih.disabled = true;
            tombolPilih.textContent = "Menyimpan foto...";
        }

        try {
            const base64Image = await new Promise((resolve, reject) => {
                const reader = new FileReader();

                reader.onload = () => resolve(reader.result);
                reader.onerror = () => reject(
                    new Error("Gagal membaca file foto.")
                );

                reader.readAsDataURL(file);
            });

            if (typeof base64Image !== "string") {
                throw new Error("Data foto tidak valid.");
            }

            /*
             * Tunggu server memastikan foto sudah tersimpan.
             * Foto di dashboard baru diperbarui setelah berhasil.
             */
            await kirimFotoKeServer("save", base64Image);

            pasangFotoProfil(base64Image);
            tutupModal();

            alert("Foto profil berhasil disimpan.");

        } catch (err) {
            console.error("Gagal menyimpan foto:", err);

            alert(
                err.message ||
                "Gagal menyimpan foto profil. Silakan coba lagi."
            );
        } finally {
            if (tombolPilih) {
                tombolPilih.disabled = false;
                tombolPilih.textContent = teksAwal;
            }

            // Memungkinkan pengguna memilih ulang file yang sama.
            this.value = "";
        }
    });
}

/* =========================================================
   HAPUS FOTO PROFIL DARI REDIS
========================================================= */

if (btnDeletePhoto) {
    btnDeletePhoto.addEventListener("click", async function() {
        const fotoSaatIni = document.getElementById("headerProfileImg");

        if (
            !fotoSaatIni ||
            fotoSaatIni.style.display === "none" ||
            !fotoSaatIni.getAttribute("src")
        ) {
            alert("Kamu belum memiliki foto profil.");
            return;
        }

        const yakin = confirm(
            "Yakin ingin menghapus foto profil?"
        );

        if (!yakin) return;

        const teksAwal = btnDeletePhoto.textContent;

        btnDeletePhoto.disabled = true;
        btnDeletePhoto.textContent = "Menghapus foto...";

        try {
            await kirimFotoKeServer("delete");

            pasangFotoProfil("");

            if (profileInput) {
                profileInput.value = "";
            }

            tutupModal();

            alert("Foto profil berhasil dihapus.");

        } catch (err) {
            console.error("Gagal menghapus foto:", err);

            alert(
                err.message ||
                "Gagal menghapus foto profil. Silakan coba lagi."
            );
        } finally {
            btnDeletePhoto.disabled = false;
            btnDeletePhoto.textContent = teksAwal;
        }
    });
}

/* =========================================================
   LOGOUT
========================================================= */

async function lakukanLogout() {
    const tombolLogout = document.querySelectorAll(
        ".btn-logout-action"
    );

    tombolLogout.forEach(btn => {
        btn.style.pointerEvents = "none";
    });

    try {
        const response = await fetch("/api/user/login", {
            method: "POST",
            credentials: "same-origin",
            headers: {
                "Content-Type": "application/json",
                "Accept": "application/json"
            },
            body: JSON.stringify({
                action: "logout"
            })
        });

        if (!response.ok) {
            throw new Error("Logout belum berhasil.");
        }

        window.location.replace("/login-user.html");

    } catch (err) {
        console.error("Gagal logout:", err);

        tombolLogout.forEach(btn => {
            btn.style.pointerEvents = "";
        });

        alert(
            "Logout gagal karena koneksi bermasalah. Silakan coba lagi."
        );
    }
}

document.querySelectorAll(".btn-logout-action").forEach(btn => {
    btn.addEventListener("click", lakukanLogout);
});

/* =========================================================
   JALANKAN PEMERIKSAAN SESI
========================================================= */

muatDataUser();
</script>
