<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preview & Pengisi PDF Invoice e-Meterai</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- PDF-Lib untuk manipulasi PDF -->
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <!-- PDF.js untuk rendering preview -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
    </script>
    <style>
        #pdf-canvas {
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 flex flex-col">

    <!-- Header -->
    <header class="bg-slate-900 text-white p-4 shadow-md">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold flex items-center gap-2">
                <svg class="w-6 h-6 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                </svg>
                Editor & Preview Template PDF (e-Meterai)
            </h1>
            <span class="text-xs bg-emerald-500/20 text-emerald-300 px-3 py-1 rounded-full border border-emerald-500/30">
                e-Meterai Ready
            </span>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto w-full p-4 md:p-6 flex-1 grid grid-cols-1 lg:grid-cols-12 gap-6">
        
        <!-- Form Control Panel (Left) -->
        <div class="lg:col-span-4 bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex flex-col justify-between space-y-6">
            <div class="space-y-6">
                <h2 class="text-lg font-semibold border-b pb-3 text-slate-700 flex items-center justify-between">
                    Input Data
                    <span class="text-xs font-normal text-slate-500">Isi form di bawah</span>
                </h2>

                <!-- 1. Upload File Template PDF -->
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-2">1. File Template PDF</label>
                    <input type="file" id="pdf-upload" accept="application/pdf" class="block w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-slate-100 file:text-slate-700 hover:file:bg-slate-200 cursor-pointer border border-slate-200 rounded-xl">
                    <p class="text-[11px] text-slate-400 mt-1">* Unggah file PDF `INV-20260810-545298-stamp.pdf` Anda.</p>
                </div>

                <!-- 2. Form Input Nama & Alamat -->
                <div class="space-y-4">
                    <div>
                        <label for="input-nama" class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">Nama Lengkap</label>
                        <input type="text" id="input-nama" value="Budi Santoso" placeholder="Masukkan Nama..." class="w-full px-3 py-2 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-sm">
                    </div>

                    <div>
                        <label for="input-alamat" class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">Alamat Lengkap</label>
                        <textarea id="input-alamat" rows="3" placeholder="Masukkan Alamat..." class="w-full px-3 py-2 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-sm">Jl. Pemuda No. 123, Kel. Embong Kaliasin, Kec. Genteng, Kota Surabaya, Jawa Timur 60271</textarea>
                    </div>
                </div>

                <!-- 3. Kontrol Posisi Teks (Pengaturan X & Y) -->
                <div class="border-t border-slate-100 pt-4 space-y-3">
                    <h3 class="text-xs font-bold text-slate-500 uppercase tracking-wider">Atur Posisi Teks</h3>
                    
                    <div class="grid grid-cols-2 gap-3 text-xs">
                        <div>
                            <label class="block text-slate-600 mb-1">Posisi X: <span id="val-x" class="font-bold">150</span></label>
                            <input type="range" id="pos-x" min="20" max="500" value="150" class="w-full h-1 bg-slate-200 rounded-lg appearance-none cursor-pointer">
                        </div>
                        <div>
                            <label class="block text-slate-600 mb-1">Posisi Y: <span id="val-y" class="font-bold">620</span></label>
                            <input type="range" id="pos-y" min="50" max="800" value="620" class="w-full h-1 bg-slate-200 rounded-lg appearance-none cursor-pointer">
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-3 text-xs">
                        <div>
                            <label class="block text-slate-600 mb-1">Ukuran Font: <span id="val-size" class="font-bold">11</span></label>
                            <input type="range" id="font-size" min="8" max="24" value="11" class="w-full h-1 bg-slate-200 rounded-lg appearance-none cursor-pointer">
                        </div>
                        <div>
                            <label class="block text-slate-600 mb-1">Tampilkan e-Meterai</label>
                            <input type="checkbox" id="show-meterai" checked class="w-4 h-4 text-emerald-600 rounded border-slate-300 focus:ring-emerald-500 mt-1">
                        </div>
                    </div>
                </div>
            </div>

            <!-- Tombol Aksi -->
            <div class="space-y-2 pt-4 border-t border-slate-100">
                <button id="btn-download" class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold rounded-xl shadow-md transition flex items-center justify-center gap-2 text-sm">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
                    </svg>
                    Unduh PDF Terisi
                </button>
            </div>
        </div>

        <!-- Preview Canvas Panel (Right) -->
        <div class="lg:col-span-8 bg-slate-200/60 rounded-2xl p-4 flex flex-col items-center justify-center min-h-[500px] border border-slate-300/60 relative overflow-hidden">
            <div id="loading" class="hidden absolute inset-0 bg-white/80 backdrop-blur-sm z-10 flex flex-col items-center justify-center gap-3">
                <div class="w-8 h-8 border-4 border-indigo-600 border-t-transparent rounded-full animate-spin"></div>
                <span class="text-xs font-semibold text-slate-600">Memproses PDF & e-Meterai...</span>
            </div>

            <div id="preview-container" class="relative max-w-full overflow-auto">
                <canvas id="pdf-canvas" class="bg-white rounded-lg"></canvas>
            </div>
        </div>

    </main>

        let currentPdfBytes = null;
        let pdfLibDoc = null;
        let originalPageDimensions = { width: 595.28, height: 841.89 }; // Standard A4

        // Dapatkan Elemen DOM
        const inputPdf = document.getElementById('pdf-upload');
        const inputNama = document.getElementById('input-nama');
        const inputAlamat = document.getElementById('input-alamat');
        const posX = document.getElementById('pos-x');
        const posY = document.getElementById('pos-y');
        const fontSize = document.getElementById('font-size');
        const showMeterai = document.getElementById('show-meterai');
        
        const valX = document.getElementById('val-x');
        const valY = document.getElementById('val-y');
        const valSize = document.getElementById('val-size');
        
        const canvas = document.getElementById('pdf-canvas');
        const ctx = canvas.getContext('2d');
        const loading = document.getElementById('loading');
        const btnDownload = document.getElementById('btn-download');

        // Event Listeners
        inputPdf.addEventListener('change', handleFileUpload);
        [inputNama, inputAlamat, posX, posY, fontSize, showMeterai].forEach(el => {
            el.addEventListener('input', updatePreview);
        });
        btnDownload.addEventListener('click', downloadModifiedPdf);

        // Handler untuk Upload File PDF dari User
        async function handleFileUpload(e) {
            const file = e.target.files[0];
            if (!file) return;

            showLoading(true);
            try {
                const arrayBuffer = await file.arrayBuffer();
                currentPdfBytes = arrayBuffer;
                await updatePreview();
            } catch (err) {
                alert('Gagal membaca file PDF: ' + err.message);
            } finally {
                showLoading(false);
            }
        }

        // Fungsi Utama untuk Merender Preview Dokumen
        async function updatePreview() {
            // Update Label Slider
            valX.textContent = posX.value;
            valY.textContent = posY.value;
            valSize.textContent = fontSize.value;

            showLoading(true);

            try {
                // 1. Inisialisasi PDF Document
                let pdfBytesToRender = currentPdfBytes;
                
                // Jika belum ada file diupload, buat halaman kosong berukuran A4
                if (!pdfBytesToRender) {
                    const tempDoc = await PDFLib.PDFDocument.create();
                    tempDoc.addPage([595.28, 841.89]);
                    pdfBytesToRender = await tempDoc.save();
                }

                // Load dengan PDFLib untuk memodifikasi
                const modifiedPdfDoc = await PDFLib.PDFDocument.load(pdfBytesToRender);
                const firstPage = modifiedPdfDoc.getPages()[0];
                const { width, height } = firstPage.getSize();
                originalPageDimensions = { width, height };

                // Embed Gambar e-Meterai jika Diaktifkan
                if (showMeterai.checked) {
                    const meteraiImage = await modifiedPdfDoc.embedPng(E_METERAI_BASE64);
                    // Koordinat presisi e-Meterai di area kiri bawah dokumen (110x110 px)
                    firstPage.drawImage(meteraiImage, {
                        x: 40,
                        y: 110,
                        width: 110,
                        height: 110,
                    });
                }

                // Gambar Teks Nama dan Alamat
                const font = await modifiedPdfDoc.embedFont(PDFLib.StandardFonts.HelveticaBold);
                const size = parseInt(fontSize.value);
                const x = parseInt(posX.value);
                const y = parseInt(posY.value);

                // Cetak Nama
                if (inputNama.value) {
                    firstPage.drawText(inputNama.value, {
                        x: x,
                        y: y,
                        size: size,
                        font: font,
                        color: PDFLib.rgb(0.1, 0.1, 0.1),
                    });
                }

                // Cetak Alamat (Mendukung Multi-Line Text)
                if (inputAlamat.value) {
                    const lines = inputAlamat.value.split('\n');
                    let currentY = y - (size * 1.4);

                    lines.forEach(line => {
                        firstPage.drawText(line, {
                            x: x,
                            y: currentY,
                            size: size - 1,
                            font: font,
                            color: PDFLib.rgb(0.2, 0.2, 0.2),
                        });
                        currentY -= (size * 1.3);
                    });
                }

                // Save PDF yang dimodifikasi ke byte array
                const finalPdfBytes = await modifiedPdfDoc.save();

                // 2. Render Canvas Preview menggunakan PDF.js
                const loadingTask = pdfjsLib.getDocument({ data: finalPdfBytes });
                const pdfDoc = await loadingTask.promise;
                const page = await pdfDoc.getPage(1);

                // Atur Skala Render Canvas
                const viewport = page.getViewport({ scale: 1.5 });
                canvas.height = viewport.height;
                canvas.width = viewport.width;

                const renderContext = {
                    canvasContext: ctx,
                    viewport: viewport
                };
                await page.render(renderContext).promise;

            } catch (err) {
                console.error("Rendering error:", err);
            } finally {
                showLoading(false);
            }
        }

        // Fungsi untuk Mengunduh PDF Hasil Edit
        async function downloadModifiedPdf() {
            showLoading(true);
            try {
                let pdfBytesToProcess = currentPdfBytes;
                if (!pdfBytesToProcess) {
                    const tempDoc = await PDFLib.PDFDocument.create();
                    tempDoc.addPage([595.28, 841.89]);
                    pdfBytesToProcess = await tempDoc.save();
                }

                const pdfDoc = await PDFLib.PDFDocument.load(pdfBytesToProcess);
                const firstPage = pdfDoc.getPages()[0];

                // Embed Gambar e-Meterai
                if (showMeterai.checked) {
                    const meteraiImage = await pdfDoc.embedPng(E_METERAI_BASE64);
                    firstPage.drawImage(meteraiImage, {
                        x: 40,
                        y: 110,
                        width: 110,
                        height: 110,
                    });
                }

                // Embed Teks
                const font = await pdfDoc.embedFont(PDFLib.StandardFonts.HelveticaBold);
                const size = parseInt(fontSize.value);
                const x = parseInt(posX.value);
                const y = parseInt(posY.value);

                if (inputNama.value) {
                    firstPage.drawText(inputNama.value, {
                        x: x,
                        y: y,
                        size: size,
                        font: font,
                        color: PDFLib.rgb(0, 0, 0),
                    });
                }

                if (inputAlamat.value) {
                    const lines = inputAlamat.value.split('\n');
                    let currentY = y - (size * 1.4);

                    lines.forEach(line => {
                        firstPage.drawText(line, {
                            x: x,
                            y: currentY,
                            size: size - 1,
                            font: font,
                            color: PDFLib.rgb(0, 0, 0),
                        });
                        currentY -= (size * 1.3);
                    });
                }

                const pdfBytes = await pdfDoc.save();

                // Trigger Download
                const blob = new Blob([pdfBytes], { type: 'application/pdf' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = `INV_${inputNama.value.replace(/\s+/g, '_') || 'Terisi'}.pdf`;
                link.click();
                URL.revokeObjectURL(link.href);

            } catch (err) {
                alert('Gagal mengunduh PDF: ' + err.message);
            } finally {
                showLoading(false);
            }
        }

        function showLoading(state) {
            if (state) {
                loading.classList.remove('hidden');
            } else {
                loading.classList.add('hidden');
            }
        }

        // Render preview awal saat halaman dibuka
        window.addEventListener('DOMContentLoaded', updatePreview);
    </script>
