<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stempel e-Meterai Otomatis - YUK BERES</title>
    <script src="https://unpkg.com/pdf-lib@1.4.0"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
        body { background: #fff5f5; color: #222; padding: 30px; }
        .container { max-width: 600px; margin: auto; background: white; padding: 30px; border-radius: 16px; border: 1px solid #f2dede; box-shadow: 0 10px 25px rgba(168,0,0,0.08); }
        h1 { color: #a80000; font-size: 22px; margin-bottom: 8px; }
        p { color: #666; font-size: 14px; margin-bottom: 20px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: bold; font-size: 14px; margin-bottom: 8px; color: #333; }
        input[type="file"] { width: 100%; padding: 12px; border: 1px dashed #a80000; border-radius: 8px; background: #fff8f8; cursor: pointer; }
        button { width: 100%; background: #a80000; color: white; border: none; padding: 14px; border-radius: 10px; font-size: 15px; font-weight: bold; cursor: pointer; transition: 0.2s; margin-top: 10px; }
        button:hover { background: #850000; }
        #status { margin-top: 15px; font-size: 13px; text-align: center; color: #555; font-weight: 600; }
    </style>
</head>
<body>

<div class="container">
    <h1>Stempel e-Meterai Otomatis</h1>
    <p>Masukkan template master yang sudah ada meterainya dan invoice perpanjangan baru. Sistem akan menggabungkan bagian meterai secara presisi.</p>
    
    <div class="form-group">
        <label for="templateFile">1. Upload Template Master (PDF yang Sudah Ada Meterai)</label>
        <input type="file" id="templateFile" accept="application/pdf">
    </div>

    <div class="form-group">
        <label for="newFile">2. Upload Invoice Baru (PDF Perpanjangan Tanpa Meterai)</label>
        <input type="file" id="newFile" accept="application/pdf">
    </div>

    <button id="processBtn" type="button">Proses & Download PDF Bermeterai</button>
    <div id="status"></div>
</div>

<script>
document.getElementById('processBtn').addEventListener('click', async () => {
    const templateInput = document.getElementById('templateFile');
    const newFileInput = document.getElementById('newFile');
    const statusDiv = document.getElementById('status');

    if (!templateInput.files.length || !newFileInput.files.length) {
        alert('Harap pilih kedua file PDF terlebih dahulu!');
        return;
    }

    statusDiv.textContent = 'Memproses penggabungan dokumen...';

    try {
        const templateBuffer = await templateInput.files[0].arrayBuffer();
        const newFileBuffer = await newFileInput.files[0].arrayBuffer();

        const { PDFDocument } = PDFLib;

        // Load kedua PDF
        const templatePdf = await PDFDocument.load(templateBuffer);
        const newPdf = await PDFDocument.load(newFileBuffer);

        const newPages = newPdf.getPages();
        const firstNewPage = newPages[0];
        const { width, height } = firstNewPage.getSize();

        // Ambil halaman 1 dari template master yang ada meterainya
        const [embeddedTemplatePage] = await newPdf.embedPages(templatePdf, [0]);

        // Menggambar area bawah template master (tempat meterai berada) di atas invoice baru secara utuh
        // Dengan cara ini, layout invoice baru tetap aman, dan bagian meterai dari master tertempel sempurna di posisi yang sama.
        firstNewPage.drawPage(embeddedTemplatePage, {
            x: 0,
            y: 0,
            width: width,
            height: height,
        });

        // Simpan file PDF baru
        const modifiedPdfBytes = await newPdf.save();
        const blob = new Blob([modifiedPdfBytes], { type: 'application/pdf' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = newFileInput.files[0].name.replace('.pdf', '-bermeterai.pdf');
        link.click();

        statusDiv.textContent = 'Berhasil! File PDF bermeterai telah di-download.';
    } catch (error) {
        console.error(error);
        statusDiv.textContent = 'Terjadi kesalahan: ' + error.message;
    }
});
</script>

</body>
</html>
