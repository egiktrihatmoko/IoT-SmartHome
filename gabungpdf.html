<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stempel e-Meterai Otomatis - YUK BERES</title>
    <script src="https://unpkg.com/pdf-lib@1.4.0"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
        body { background: #fff5f5; color: #222; padding: 30px; }
        .container { max-width: 600px; margin: auto; background: white; padding: 30px; border-radius: 16px; border: 1px solid #f2dede; box-shadow: 0 10px 25px rgba(168,0,0,0.08); }
        h1 { color: #a80000; font-size: 22px; margin-bottom: 8px; }
        p { color: #666; font-size: 14px; margin-bottom: 20px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: bold; font-size: 14px; margin-bottom: 8px; color: #333; }
        input[type="file"], input[type="text"] { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; background: #fff; font-size: 14px; }
        input[type="file"] { border: 1px dashed #a80000; background: #fff8f8; cursor: pointer; }
        button { width: 100%; background: #a80000; color: white; border: none; padding: 14px; border-radius: 10px; font-size: 15px; font-weight: bold; cursor: pointer; transition: 0.2s; margin-top: 10px; }
        button:hover { background: #850000; }
        #status { margin-top: 15px; font-size: 13px; text-align: center; color: #555; font-weight: 600; }
    </style>
</head>
<body>

<div class="container">
    <h1>Perpanjang Batas Pembayaran Invoice</h1>
    <p>Gunakan template master bermeterai utuh, lalu perbarui tanggal batas pembayaran tanpa merusak e-meterai.</p>
    
    <div class="form-group">
        <label for="templateFile">1. Upload Template Master (PDF yang Sudah Ada Meterai)</label>
        <input type="file" id="templateFile" accept="application/pdf">
    </div>

    <div class="form-group">
        <label for="batasBaru">2. Masukkan Batas Pembayaran Baru</label>
        <input type="text" id="batasBaru" placeholder="Contoh: 20 November 2026, 15:00:00">
    </div>

    <button id="processBtn" type="button">Proses & Download Invoice Baru</button>
    <div id="status"></div>
</div>

<script>
document.getElementById('processBtn').addEventListener('click', async () => {
    const templateInput = document.getElementById('templateFile');
    const batasBaruInput = document.getElementById('batasBaru').value.trim();
    const statusDiv = document.getElementById('status');

    if (!templateInput.files.length) {
        alert('Harap upload file template PDF bermeterai terlebih dahulu!');
        return;
    }

    if (!batasBaruInput) {
        alert('Harap isi teks Batas Pembayaran Baru!');
        return;
    }

    statusDiv.textContent = 'Memproses pembaharuan invoice...';

    try {
        const templateBuffer = await templateInput.files[0].arrayBuffer();
        const { PDFDocument, rgb, StandardFonts } = PDFLib;

        // Load dokumen template master
        const pdfDoc = await PDFDocument.load(templateBuffer);
        const pages = pdfDoc.getPages();
        const firstPage = pages[0];
        const { width, height } = firstPage.getSize();

        // 1. Tutup area Batas Pembayaran LAMA menggunakan kotak putih bersih
        // Koordinat ini tepat menutup baris teks Batas Pembayaran
        firstPage.drawRectangle({
            x: 120,
            y: height - 355,
            width: 250,
            height: 18,
            color: rgb(1, 1, 1), // Warna putih murni
        });

        // 2. Tulis Batas Pembayaran BARU di lokasi yang sama persis
        const font = await pdfDoc.embedFont(StandardFonts.Helvetica);
        firstPage.drawText(batasBaruInput, {
            x: 122,
            y: height - 351,
            size: 9,
            font: font,
            color: rgb(0, 0, 0),
        });

        // Simpan hasil PDF baru
        const modifiedPdfBytes = await pdfDoc.save();
        const blob = new Blob([modifiedPdfBytes], { type: 'application/pdf' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = templateInput.files[0].name.replace('.pdf', '-perpanjangan.pdf');
        link.click();

        statusDiv.textContent = 'Berhasil! File invoice perpanjangan telah di-download.';
    } catch (error) {
        console.error(error);
        statusDiv.textContent = 'Terjadi kesalahan saat memproses file PDF.';
    }
});
</script>

</body>
</html>
