<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stempel e-Meterai Otomatis - YUK BERES</title>
    <!-- Memuat pustaka pdf-lib untuk manipulasi PDF -->
    <script src="https://unpkg.com/pdf-lib@1.4.0"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
        body { background: #fff5f5; color: #222; padding: 30px; }
        .container { max-width: 600px; margin: auto; background: white; padding: 30px; border-radius: 16px; border: 1px solid #f2dede; box-shadow: 0 10px 25px rgba(168,0,0,0.08); }
        h1 { color: #a80000; font-size: 22px; margin-bottom: 8px; }
        p { color: #666; font-size: 14px; margin-bottom: 20px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: bold; font-size: 14px; margin-bottom: 8px; color: #333; }
        input[type="file"] { width: 100%; padding: 12px; border: 1px dashed #a80000; border-radius: 8px; background: #fff8f8; cursor: pointer; }
        button { width: 100%; background: #a80000; color: white; border: none; padding: 14px; border-radius: 10px; font-size: 15px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { background: #850000; }
        #status { margin-top: 15px; font-size: 13px; text-align: center; color: #555; font-weight: 600; }
    </style>
</head>
<body>

<div class="container">
    <h1>Stempel e-Meterai Otomatis</h1>
    <p>Unggah file template master yang sudah ada meterainya secara utuh, lalu gabungkan dengan file invoice perpanjangan baru.</p>
    
    <div class="form-group">
        <label for="templateFile">1. Upload Template Master (PDF yang Sudah Ada Meterai)</label>
        <input type="file" id="templateFile" accept="application/pdf">
    </div>

    <div class="form-group">
        <label for="newFile">2. Upload Invoice Baru (PDF Perpanjangan Tanpa Meterai)</label>
        <input type="file" id="newFile" accept="application/pdf">
    </div>

    <button id="processBtn" type="button">Proses & Download PDF Bermeterai</button>
    <div id="status"></div>
</div>

<script>
document.getElementById('processBtn').addEventListener('click', async () => {
    const templateInput = document.getElementById('templateFile');
    const newFileInput = document.getElementById('newFile');
    const statusDiv = document.getElementById('status');

    if (!templateInput.files.length || !newFileInput.files.length) {
        alert('Harap pilih kedua file PDF terlebih dahulu!');
        return;
    }

    statusDiv.textContent = 'Memproses dokumen...';

    try {
        const templateBuffer = await templateInput.files[0].arrayBuffer();
        const newFileBuffer = await newFileInput.files[0].arrayBuffer();

        const { PDFDocument } = PDFLib;

        // Load dokumen template master dan dokumen baru
        const templatePdf = await PDFDocument.load(templateBuffer);
        const newPdf = await PDFDocument.load(newFileBuffer);

        // Ambil halaman pertama dari template master (yang sudah ada meterainya)
        const [templatePage] = await templatePdf.copyPages(newPdf, [0]); // Contoh logika penyalinan halaman/overlay
        
        // Atau jika ingin menimpa halaman, kita bisa menyalin halaman dari invoice baru
        // lalu menempelkan area meterai utuh dari halaman template master ke file baru:
        const pages = newPdf.getPages();
        const firstNewPage = pages[0];

        // Ambil halaman pertama master sebagai acuan utuh atau ambil bagian meterainya saja secara utuh
        const [masterFirstPage] = await newPdf.copyPages(templatePdf, [0]);
        
        // Cara paling aman tanpa merusak template: Kita gabungkan halaman-halaman dari invoice baru, 
        // lalu pada halaman 1, kita timpa bagian bawahnya menggunakan halaman master yang sudah ada meterainya.
        
        // Alternatif langsung: Salin seluruh halaman invoice baru, lalu embed halaman master sebagai layer tambahan di area bawah
        const embeddedMasterPage = await newPdf.embedPage(templatePdf.getPage(0));
        
        // Ambil ukuran halaman
        const { width, height } = firstNewPage.getSize();

        // Menggambar halaman master secara utuh/bagian bawahnya ke atas halaman invoice baru secara presisi
        firstNewPage.drawPage(embeddedMasterPage, {
            x: 0,
            y: 0,
            width: width,
            height: height,
            // Anda bisa mengatur opacity atau crop jika diperlukan, 
            // atau menggunakan template master langsung sebagai dasar utama PDF baru.
        });

        // Simpan hasil akhir
        const modifiedPdfBytes = await newPdf.save();
        const blob = new Blob([modifiedPdfBytes], { type: 'application/pdf' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = newFileInput.files[0].name.replace('.pdf', '-bermeterai.pdf');
        link.click();

        statusDiv.textContent = 'Berhasil! File PDF bermeterai telah di-download.';
    } catch (error) {
        console.error(error);
        statusDiv.textContent = 'Terjadi kesalahan saat memproses file PDF.';
    }
});
</script>

</body>
</html>
