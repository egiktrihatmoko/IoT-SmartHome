<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stempel e-Meterai Otomatis - YUK BERES</title>
    <!-- Memuat pustaka pdf-lib dari CDN untuk memanipulasi PDF langsung di browser -->
    <script src="https://unpkg.com/pdf-lib@1.4.0"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
        body { background: #fff5f5; color: #222; padding: 30px; }
        .container { max-width: 600px; margin: auto; background: white; padding: 30px; border-radius: 16px; border: 1px solid #f2dede; box-shadow: 0 10px 25px rgba(168,0,0,0.08); }
        h1 { color: #a80000; font-size: 22px; margin-bottom: 8px; }
        p { color: #666; font-size: 14px; margin-bottom: 20px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: bold; font-size: 14px; margin-bottom: 8px; color: #333; }
        input[type="file"] { width: 100%; padding: 12px; border: 1px dashed #a80000; border-radius: 8px; background: #fff8f8; cursor: pointer; }
        button { width: 100%; background: #a80000; color: white; border: none; padding: 14px; border-radius: 10px; font-size: 15px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { background: #850000; }
        #status { margin-top: 15px; font-size: 13px; text-align: center; color: #555; }
    </style>
</head>
<body>

<div class="container">
    <h1>Stempel e-Meterai Otomatis</h1>
    <p>Upload file PDF invoice perpanjangan baru yang belum ada meterainya. Sistem akan otomatis membubuhkan e-Meterai Rp10.000 di halaman pertama.</p>
    
    <div class="form-group">
        <label for="pdfFile">Pilih File PDF Invoice (.pdf)</label>
        <input type="file" id="pdfFile" accept="application/pdf">
    </div>

    <button id="processBtn" type="button">Proses & Download PDF Bermeterai</button>
    <div id="status"></div>
</div>

<script>
document.getElementById('processBtn').addEventListener('click', async () => {
    const fileInput = document.getElementById('pdfFile');
    const statusDiv = document.getElementById('status');

    if (!fileInput.files || fileInput.files.length === 0) {
        alert('Silakan pilih file PDF terlebih dahulu!');
        return;
    }

    const file = fileInput.files[0];
    statusDiv.textContent = 'Memproses dokumen PDF...';

    try {
        const arrayBuffer = await file.arrayBuffer();
        
        // Memuat dokumen PDF menggunakan pdf-lib
        const { PDFDocument, rgb } = PDFLib;
        const pdfDoc = await PDFDocument.load(arrayBuffer);

        // Ambil halaman pertama invoice
        const pages = pdfDoc.getPages();
        const firstPage = pages[0];
        const { width, height } = firstPage.getSize();

        // Menggambar kotak / area stempel meterai di posisi yang pas (koordinat disesuaikan dengan template asli)
        // Contoh koordinat di bagian bawah dokumen (mendekati area tanda tangan penjual)
        const boxX = width - 180;
        const boxY = 180;
        const boxWidth = 110;
        const boxHeight = 65;

        // Gambar background putih/merah muda tipis untuk area meterai
        firstPage.drawRectangle({
            x: boxX,
            y: boxY,
            width: boxWidth,
            height: boxHeight,
            color: PDFLib.rgb(1, 0.95, 0.95),
            borderColor: PDFLib.rgb(0.66, 0, 0),
            borderWidth: 1.5,
        });

        // Tambahkan teks stempel e-Meterai
        firstPage.drawText('CV. JAYA ABADI SOLUSI', {
            x: boxX + 6,
            y: boxY + 48,
            size: 7,
            color: rgb(0.2, 0.2, 0.2),
        });

        firstPage.drawText('MOCH. FIRMAN ANIS R.', {
            x: boxX + 6,
            y: boxY + 38,
            size: 7,
            color: rgb(0.2, 0.2, 0.2),
        });

        firstPage.drawText('METERAI', {
            x: boxX + 32,
            y: boxY + 25,
            size: 9,
            font: await pdfDoc.embedFont(PDFLib.StandardFonts.HelveticaBold),
            color: rgb(0.66, 0, 0),
        });

        firstPage.drawText('10000', {
            x: boxX + 38,
            y: boxY + 12,
            size: 11,
            font: await pdfDoc.embedFont(PDFLib.StandardFonts.HelveticaBold),
            color: rgb(0.66, 0, 0),
        });

        // Simpan dokumen PDF yang sudah dimodifikasi
        const modifiedPdfBytes = await pdfDoc.save();

        // Buat link download otomatis untuk user
        const blob = new Blob([modifiedPdfBytes], { type: 'application/pdf' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = file.name.replace('.pdf', '-stamped.pdf');
        link.click();

        statusDiv.textContent = 'Berhasil! File PDF bermeterai telah di-download.';
    } catch (error) {
        console.error(error);
        statusDiv.textContent = 'Terjadi kesalahan saat memproses PDF.';
    }
});
</script>

</body>
</html>
