
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#b91c1c">
  <title>Admin Panel - Kalkulator Harga Tayang</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, Helvetica, sans-serif;
      background: #fff5f5;
      color: #222;
    }

    .container {
      width: 100%;
      max-width: 390px;
      padding: 28px 24px;
      background: #fff;
      border: 1px solid #f3dada;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(150, 0, 0, 0.08);
    }

    .logo {
      width: 52px;
      height: 52px;
      margin: 0 auto 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 14px;
      background: #b91c1c;
      color: #fff;
      font-size: 25px;
      font-weight: bold;
    }

    h1 {
      text-align: center;
      font-size: 23px;
      color: #991b1b;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      font-size: 13px;
      line-height: 1.5;
      margin-bottom: 24px;
    }

    .tabs {
      display: flex;
      gap: 5px;
      padding: 5px;
      margin-bottom: 24px;
      border-radius: 10px;
      background: #fee2e2;
    }

    .tab {
      flex: 1;
      padding: 11px 8px;
      border: none;
      border-radius: 7px;
      background: transparent;
      color: #991b1b;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }

    .tab.active {
      background: #b91c1c;
      color: #fff;
      box-shadow: 0 2px 6px rgba(185, 28, 28, 0.2);
    }

    .form-title {
      font-size: 18px;
      margin-bottom: 6px;
    }

    .form-description {
      color: #777;
      font-size: 13px;
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px 12px;
      border: 1px solid #ddd;
      border-radius: 9px;
      outline: none;
      font-size: 14px;
      background: #fff;
    }

    input:focus {
      border-color: #dc2626;
      box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.08);
    }

    .submit-btn {
      width: 100%;
      padding: 14px;
      margin-top: 4px;
      border: none;
      border-radius: 9px;
      background: #b91c1c;
      color: #fff;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }

    .submit-btn:hover {
      background: #991b1b;
    }

    .submit-btn:disabled {
      opacity: .65;
      cursor: wait;
    }

    .message {
      display: none;
      padding: 12px;
      margin-top: 16px;
      border-radius: 8px;
      background: #fff1f2;
      color: #991b1b;
      font-size: 13px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .message.success {
      background: #dcfce7;
      color: #166534;
    }

    .footer {
      margin-top: 24px;
      text-align: center;
      font-size: 11px;
      color: #999;
    }

    [hidden] {
      display: none !important;
    }

    @media (max-width: 420px) {
      .container {
        padding: 24px 19px;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <div class="logo">A</div>

    <h1>Admin Panel</h1>
    <p class="subtitle">Kalkulator Harga Tayang</p>

    <div class="tabs" role="tablist" aria-label="Menu akun">
      <button type="button" class="tab active"
        id="loginTab" role="tab" aria-selected="true"
        aria-controls="loginForm">
        Masuk
      </button>

      <button type="button" class="tab"
        id="registerTab" role="tab" aria-selected="false"
        aria-controls="registerForm">
        Mendaftar
      </button>
    </div>

    <form id="loginForm">
      <h2 class="form-title">Selamat datang!</h2>
      <p class="form-description">Masuk ke akun admin kamu.</p>

      <div class="form-group">
        <label for="loginEmail">Email</label>
        <input type="email" id="loginEmail" name="email"
          placeholder="Masukkan email" autocomplete="username"
          maxlength="254" required>
      </div>

      <div class="form-group">
        <label for="loginPassword">Password</label>
        <input type="password" id="loginPassword" name="password"
          placeholder="Masukkan password"
          autocomplete="current-password" required>
      </div>

      <button type="submit" class="submit-btn">Masuk</button>
    </form>

    <form id="registerForm" hidden>
      <h2 class="form-title">Buat akun admin</h2>
      <p class="form-description">
        Daftar menggunakan email dan password kamu.
      </p>

      <div class="form-group">
        <label for="registerEmail">Email</label>
        <input type="email" id="registerEmail" name="email"
          placeholder="Masukkan email" autocomplete="email"
          maxlength="254" required>
      </div>

      <div class="form-group">
        <label for="registerPassword">Password</label>
        <input type="password" id="registerPassword" name="password"
          placeholder="Minimal 12 karakter" minlength="12"
          maxlength="128" autocomplete="new-password" required>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Konfirmasi Password</label>
        <input type="password" id="confirmPassword"
          name="confirmPassword" placeholder="Ulangi password"
          minlength="12" maxlength="128"
          autocomplete="new-password" required>
      </div>

      <button type="submit" class="submit-btn">Daftar Admin</button>
    </form>

    <div class="message" id="message"
      role="status" aria-live="polite"></div>

    <p class="footer">
      &copy; 2026 Kalkulator Harga Tayang
    </p>
  </main>

  <script>
    const loginTab = document.getElementById("loginTab");
    const registerTab = document.getElementById("registerTab");
    const loginForm = document.getElementById("loginForm");
    const registerForm = document.getElementById("registerForm");
    const message = document.getElementById("message");

    function showTab(tab) {
      const isLogin = tab === "login";

      loginForm.hidden = !isLogin;
      registerForm.hidden = isLogin;

      loginTab.classList.toggle("active", isLogin);
      registerTab.classList.toggle("active", !isLogin);

      loginTab.setAttribute("aria-selected", String(isLogin));
      registerTab.setAttribute("aria-selected", String(!isLogin));

      message.style.display = "none";
      message.textContent = "";
      message.classList.remove("success");
    }

    loginTab.addEventListener("click", () => showTab("login"));
    registerTab.addEventListener("click", () => showTab("register"));

    function showMessage(text, success = false) {
      message.textContent = text;
      message.style.display = "block";
      message.classList.toggle("success", success);
    }

    async function sendRequest(endpoint, payload) {
      const response = await fetch(endpoint, {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        credentials: "same-origin",
        body: JSON.stringify(payload)
      });

      const data = await response.json().catch(() => ({}));

      if (!response.ok) {
        throw new Error(data.message || "Permintaan gagal.");
      }

      return data;
    }

    registerForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      const email =
        document.getElementById("registerEmail").value.trim();
      const password =
        document.getElementById("registerPassword").value;
      const confirmPassword =
        document.getElementById("confirmPassword").value;

      if (password !== confirmPassword) {
        showMessage("Konfirmasi password tidak sama.");
        return;
      }

      if (password.length < 12) {
        showMessage("Password minimal 12 karakter.");
        return;
      }

      const button = registerForm.querySelector('button[type="submit"]');
      button.disabled = true;
      button.textContent = "Mendaftarkan...";

      try {
        const data = await sendRequest("/api/admin/register", {
          email,
          password
        });

        registerForm.reset();
        showTab("login");
        showMessage(
          data.message || "Pendaftaran berhasil. Silakan masuk.",
          true
        );
      } catch (error) {
        showMessage(error.message || "Pendaftaran gagal.");
      } finally {
        button.disabled = false;
        button.textContent = "Daftar Admin";
      }
    });

    loginForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      const email =
        document.getElementById("loginEmail").value.trim();
      const password =
        document.getElementById("loginPassword").value;

      const button = loginForm.querySelector('button[type="submit"]');
      button.disabled = true;
      button.textContent = "Memeriksa...";

      try {
        const data = await sendRequest("/api/admin/login", {
          email,
          password
        });

        showMessage(data.message || "Login berhasil.", true);

        // Arahkan ke dashboard hanya setelah endpoint dashboard
        // dan pemeriksaan sesi benar-benar tersedia.
      } catch (error) {
        showMessage(error.message || "Login gagal.");
      } finally {
        button.disabled = false;
        button.textContent = "Masuk";
      }
    });
  </script>
</body>
</html>
