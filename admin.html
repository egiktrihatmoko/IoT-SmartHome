<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#b91c1c">
  <title>Admin Panel - Kalkulator Harga Tayang</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, Helvetica, sans-serif;
      background: #fff5f5;
      color: #222;
    }

    .container {
      width: 100%;
      max-width: 390px;
      padding: 28px 24px;
      background: #fff;
      border: 1px solid #f3dada;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(150, 0, 0, 0.08);
    }

    .logo {
      width: 52px;
      height: 52px;
      margin: 0 auto 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 14px;
      background: #b91c1c;
      color: #fff;
      font-size: 25px;
      font-weight: bold;
    }

    h1 {
      text-align: center;
      font-size: 23px;
      color: #991b1b;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      font-size: 13px;
      line-height: 1.5;
      margin-bottom: 24px;
    }

    .tabs {
      display: flex;
      gap: 5px;
      padding: 5px;
      margin-bottom: 24px;
      border-radius: 10px;
      background: #fee2e2;
    }

    .tab {
      flex: 1;
      padding: 11px 8px;
      border: none;
      border-radius: 7px;
      background: transparent;
      color: #991b1b;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }

    .tab.active {
      background: #b91c1c;
      color: #fff;
      box-shadow: 0 2px 6px rgba(185, 28, 28, 0.2);
    }

    .form-title {
      font-size: 18px;
      margin-bottom: 6px;
    }

    .form-description {
      color: #777;
      font-size: 13px;
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px 12px;
      border: 1px solid #ddd;
      border-radius: 9px;
      outline: none;
      font-size: 14px;
      background: #fff;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus {
      border-color: #dc2626;
      box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.08);
    }

    .submit-btn {
      width: 100%;
      padding: 14px;
      margin-top: 4px;
      border: none;
      border-radius: 9px;
      background: #b91c1c;
      color: #fff;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    .submit-btn:hover {
      background: #991b1b;
    }

    .message {
      display: none;
      padding: 12px;
      margin-top: 16px;
      border-radius: 8px;
      background: #fff1f2;
      color: #991b1b;
      font-size: 13px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .footer {
      margin-top: 24px;
      text-align: center;
      font-size: 11px;
      color: #999;
    }

    [hidden] {
      display: none !important;
    }

    @media (max-width: 420px) {
      .container {
        padding: 24px 19px;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <div class="logo">A</div>

    <h1>Admin Panel</h1>
    <p class="subtitle">Kalkulator Harga Tayang</p>

    <div class="tabs" role="tablist" aria-label="Menu akun">
      <button
        type="button"
        class="tab active"
        id="loginTab"
        role="tab"
        aria-selected="true"
        aria-controls="loginForm"
      >
        Masuk
      </button>

      <button
        type="button"
        class="tab"
        id="registerTab"
        role="tab"
        aria-selected="false"
        aria-controls="registerForm"
      >
        Mendaftar
      </button>
    </div>

    <!-- FORM MASUK -->
    <form id="loginForm">
      <h2 class="form-title">Selamat datang!</h2>
      <p class="form-description">Masuk ke akun admin kamu.</p>

      <div class="form-group">
        <label for="loginEmail">Email</label>
        <input
          type="email"
          id="loginEmail"
          name="email"
          placeholder="Masukkan email"
          autocomplete="username"
          required
        >
      </div>

      <div class="form-group">
        <label for="loginPassword">Password</label>
        <input
          type="password"
          id="loginPassword"
          name="password"
          placeholder="Masukkan password"
          autocomplete="current-password"
          required
        >
      </div>

      <button type="submit" class="submit-btn">Masuk</button>
    </form>

    <!-- FORM PENDAFTARAN -->
    <form id="registerForm" hidden>
      <h2 class="form-title">Buat akun admin</h2>
      <p class="form-description">Isi data untuk mendaftar.</p>

      <div class="form-group">
        <label for="registerEmail">Email</label>
        <input
          type="email"
          id="registerEmail"
          name="email"
          placeholder="Masukkan email"
          autocomplete="email"
          required
        >
      </div>

      <div class="form-group">
        <label for="registerPassword">Password</label>
        <input
          type="password"
          id="registerPassword"
          name="password"
          placeholder="Minimal 12 karakter"
          minlength="12"
          autocomplete="new-password"
          required
        >
      </div>

      <div class="form-group">
        <label for="confirmPassword">Konfirmasi Password</label>
        <input
          type="password"
          id="confirmPassword"
          name="confirmPassword"
          placeholder="Ulangi password"
          minlength="12"
          autocomplete="new-password"
          required
        >
      </div>

      <button type="submit" class="submit-btn">Daftar Admin</button>
    </form>

    <div class="message" id="message" role="status" aria-live="polite"></div>

    <p class="footer">
      &copy; 2026 Kalkulator Harga Tayang
    </p>
  </main>

  <script>
    const loginTab = document.getElementById("loginTab");
    const registerTab = document.getElementById("registerTab");
    const loginForm = document.getElementById("loginForm");
    const registerForm = document.getElementById("registerForm");
    const message = document.getElementById("message");

    function showTab(tab) {
      const isLogin = tab === "login";

      loginForm.hidden = !isLogin;
      registerForm.hidden = isLogin;

      loginTab.classList.toggle("active", isLogin);
      registerTab.classList.toggle("active", !isLogin);

      loginTab.setAttribute("aria-selected", String(isLogin));
      registerTab.setAttribute("aria-selected", String(!isLogin));

      message.style.display = "none";
      message.textContent = "";
    }

    loginTab.addEventListener("click", () => showTab("login"));
    registerTab.addEventListener("click", () => showTab("register"));

    function showMessage(text) {
      message.textContent = text;
      message.style.display = "block";
    }

    loginForm.addEventListener("submit", function (event) {
      event.preventDefault();

      showMessage(
        "Fitur masuk belum aktif. Hubungkan formulir ke API autentikasi server Vercel terlebih dahulu."
      );
    });

    registerForm.addEventListener("submit", function (event) {
      event.preventDefault();

      const password =
        document.getElementById("registerPassword").value;
      const confirmPassword =
        document.getElementById("confirmPassword").value;

      if (password !== confirmPassword) {
        showMessage("Konfirmasi password tidak sama.");
        return;
      }

      showMessage(
        "Formulir siap. Pendaftaran belum aktif sampai API server yang aman dibuat."
      );
    });
  </script>
</body>
</html>
