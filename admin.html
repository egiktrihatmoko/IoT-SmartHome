
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pendaftaran Admin</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: #fff5f5;
      color: #222;
    }

    .container {
      width: 100%;
      max-width: 390px;
      background: #fff;
      padding: 30px 24px;
      border-radius: 16px;
      border: 1px solid #f3dada;
      box-shadow: 0 8px 30px rgba(150, 0, 0, 0.08);
    }

    .logo {
      width: 54px;
      height: 54px;
      margin: 0 auto 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #b91c1c;
      color: white;
      border-radius: 14px;
      font-size: 25px;
      font-weight: bold;
    }

    h1 {
      text-align: center;
      font-size: 23px;
      margin-bottom: 8px;
      color: #991b1b;
    }

    .subtitle {
      text-align: center;
      color: #777;
      font-size: 13px;
      line-height: 1.5;
      margin-bottom: 25px;
    }

    .form-group {
      margin-bottom: 17px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 13px 12px;
      border: 1px solid #ddd;
      border-radius: 9px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: #dc2626;
      box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.08);
    }

    button {
      width: 100%;
      border: none;
      border-radius: 9px;
      padding: 14px;
      margin-top: 5px;
      background: #b91c1c;
      color: white;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background: #991b1b;
    }

    .message {
      display: none;
      margin-top: 16px;
      padding: 12px;
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.5;
      background: #fff1f2;
      color: #991b1b;
    }

    .footer {
      text-align: center;
      margin-top: 22px;
      font-size: 11px;
      color: #999;
    }

    @media (max-width: 400px) {
      .container {
        padding: 25px 19px;
      }

      h1 {
        font-size: 21px;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <div class="logo">A</div>

    <h1>Pendaftaran Admin</h1>
    <p class="subtitle">
      Buat akun admin untuk mengelola website
      Kalkulator Harga Tayang.
    </p>

    <form id="registerForm">
      <div class="form-group">
        <label for="email">Email Admin</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="admin@email.com"
          autocomplete="email"
          required
        >
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="Minimal 12 karakter"
          minlength="12"
          autocomplete="new-password"
          required
        >
      </div>

      <div class="form-group">
        <label for="confirmPassword">Konfirmasi Password</label>
        <input
          type="password"
          id="confirmPassword"
          name="confirmPassword"
          placeholder="Ulangi password"
          minlength="12"
          autocomplete="new-password"
          required
        >
      </div>

      <button type="submit">Daftar Admin</button>

      <div class="message" id="message" role="status"></div>
    </form>

    <p class="footer">
      &copy; 2026 Kalkulator Harga Tayang
    </p>
  </main>

  <script>
    const form = document.getElementById("registerForm");
    const message = document.getElementById("message");

    form.addEventListener("submit", function (event) {
      event.preventDefault();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const confirmPassword =
        document.getElementById("confirmPassword").value;

      message.style.display = "block";

      if (password !== confirmPassword) {
        message.textContent =
          "Konfirmasi password tidak sama.";
        return;
      }

      message.textContent =
        "Tampilan pendaftaran sudah siap. Pendaftaran belum aktif karena perlu dihubungkan ke API server yang aman.";
    });
  </script>
</body>
</html>
