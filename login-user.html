<!DOCTYPE html>
<html lang="id">
<head>
  <!-- Pengaturan dasar halaman dan tampilan pada perangkat seluler -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#b91c1c">

  <meta
    name="description"
    content="Halaman masuk dan pendaftaran akun pengguna Kalkulator Harga Tayang."
  >

  <title>Login & Daftar User - Kalkulator Harga Tayang</title>

  <style>
    /* =========================================================
       1. PENGATURAN DASAR
       Menghapus margin bawaan dan menyamakan perhitungan ukuran.
    ========================================================= */

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      padding: 20px;

      display: flex;
      align-items: center;
      justify-content: center;

      font-family: Arial, Helvetica, sans-serif;
      background: #fff5f5;
      color: #222;
    }


    /* =========================================================
       2. KARTU LOGIN DAN PENDAFTARAN
       Membuat kotak utama putih dengan sudut membulat.
    ========================================================= */

    .container {
      width: 100%;
      max-width: 390px;
      padding: 28px 24px;

      background: #fff;
      border: 1px solid #f3dada;
      border-radius: 16px;

      box-shadow: 0 8px 30px rgba(150, 0, 0, 0.08);
    }


    /* Logo huruf U untuk menandai halaman pengguna */

    .logo {
      width: 52px;
      height: 52px;
      margin: 0 auto 14px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 14px;
      background: #b91c1c;
      color: #fff;

      font-size: 25px;
      font-weight: bold;
    }


    /* Judul dan keterangan halaman */

    h1 {
      margin-bottom: 8px;

      text-align: center;
      font-size: 23px;
      color: #991b1b;
    }

    .subtitle {
      margin-bottom: 24px;

      text-align: center;
      color: #777;
      font-size: 13px;
      line-height: 1.5;
    }


    /* =========================================================
       3. TOMBOL TAB MASUK DAN MENDAFTAR
       Tab digunakan untuk berpindah antara dua formulir.
    ========================================================= */

    .tabs {
      display: flex;
      gap: 5px;

      padding: 5px;
      margin-bottom: 24px;

      border-radius: 10px;
      background: #fee2e2;
    }

    .tab {
      flex: 1;
      padding: 11px 8px;

      border: none;
      border-radius: 7px;

      background: transparent;
      color: #991b1b;

      font-size: 14px;
      font-weight: bold;

      cursor: pointer;
    }

    /* Tampilan tab yang sedang dipilih */

    .tab.active {
      background: #b91c1c;
      color: #fff;

      box-shadow: 0 2px 6px rgba(185, 28, 28, 0.2);
    }


    /* =========================================================
       4. JUDUL DAN KETERANGAN FORMULIR
    ========================================================= */

    .form-title {
      margin-bottom: 6px;
      font-size: 18px;
    }

    .form-description {
      margin-bottom: 20px;

      color: #777;
      font-size: 13px;
      line-height: 1.5;
    }


    /* =========================================================
       5. INPUT EMAIL, NAMA, DAN PASSWORD
    ========================================================= */

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 8px;

      font-size: 13px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px 12px;

      border: 1px solid #ddd;
      border-radius: 9px;
      outline: none;

      background: #fff;
      font-size: 14px;
    }

    /* Efek saat kolom sedang dipilih */

    input:focus {
      border-color: #dc2626;
      box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.08);
    }


    /* =========================================================
       6. TOMBOL UTAMA
       Tombol Masuk dan Daftar menggunakan gaya yang sama.
    ========================================================= */

    .submit-btn {
      width: 100%;
      padding: 14px;
      margin-top: 4px;

      border: none;
      border-radius: 9px;

      background: #b91c1c;
      color: #fff;

      font-size: 14px;
      font-weight: bold;

      cursor: pointer;
    }

    .submit-btn:hover {
      background: #991b1b;
    }

    /* Tampilan ketika permintaan sedang diproses */

    .submit-btn:disabled {
      opacity: 0.65;
      cursor: wait;
    }


    /* =========================================================
       7. PEMISAH DAN TOMBOL GOOGLE
       Tombol ini hanya bekerja jika endpoint OAuth Google
       di backend sudah dibuat dan dikonfigurasi.
    ========================================================= */

    .google-divider {
      display: flex;
      align-items: center;
      gap: 12px;

      margin: 24px 0;

      color: #94a3b8;
      font-size: 12px;
    }

    .google-divider::before,
    .google-divider::after {
      content: "";
      flex: 1;
      height: 1px;

      background: #e2e8f0;
    }

    .google-login-btn {
      width: 100%;
      min-height: 48px;
      padding: 12px 16px;

      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;

      border: 1px solid #e2e8f0;
      border-radius: 11px;

      background: #fff;
      color: #334155;

      font-size: 14px;
      font-weight: 600;
      text-decoration: none;

      transition: background 0.2s, border-color 0.2s;
    }

    .google-login-btn:hover {
      background: #f8fafc;
      border-color: #cbd5e1;
    }

    .google-login-btn svg {
      flex-shrink: 0;
    }


    /* =========================================================
       8. PESAN SUKSES ATAU ERROR
       Pesan ini digunakan untuk memberi tahu hasil permintaan.
    ========================================================= */

    .message {
      display: none;

      padding: 12px;
      margin-top: 16px;

      border-radius: 8px;
      background: #fff1f2;
      color: #991b1b;

      font-size: 13px;
      line-height: 1.5;

      overflow-wrap: anywhere;
    }

    .message.success {
      background: #dcfce7;
      color: #166534;
    }


    /* Keterangan hak cipta di bagian bawah */

    .footer {
      margin-top: 24px;

      text-align: center;
      font-size: 11px;
      color: #999;
    }


    /* Menyembunyikan formulir yang tidak sedang dipakai */

    [hidden] {
      display: none !important;
    }


    /* Penyesuaian jarak untuk layar HP yang kecil */

    @media (max-width: 420px) {
      .container {
        padding: 24px 19px;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <!-- Logo halaman pengguna -->
    <div class="logo" aria-hidden="true">U</div>

    <!-- Judul utama halaman -->
    <h1>Akun Pengguna</h1>

    <p class="subtitle">
      Kalkulator Harga Tayang
    </p>


    <!-- =======================================================
         TAB NAVIGASI
         Tombol Masuk menampilkan formulir login.
         Tombol Mendaftar menampilkan formulir pendaftaran.
    ======================================================== -->

    <div class="tabs" role="tablist" aria-label="Menu akun">

      <button
        type="button"
        class="tab active"
        id="loginTab"
        role="tab"
        aria-selected="true"
        aria-controls="loginForm"
      >
        Masuk
      </button>

      <button
        type="button"
        class="tab"
        id="registerTab"
        role="tab"
        aria-selected="false"
        aria-controls="registerForm"
      >
        Mendaftar
      </button>

    </div>


    <!-- =======================================================
         FORMULIR LOGIN USER
         Mengirim email dan password ke /api/user/login.
         Backend harus memeriksa akun dan membuat sesi user.
    ======================================================== -->

    <form id="loginForm">

      <h2 class="form-title">
        Selamat datang!
      </h2>

      <p class="form-description">
        Masuk ke akun pengguna kamu.
      </p>


      <!-- Kolom email untuk login -->

      <div class="form-group">

        <label for="loginEmail">
          Email
        </label>

        <input
          type="email"
          id="loginEmail"
          name="email"
          placeholder="Masukkan email"
          autocomplete="username"
          maxlength="254"
          required
        >

      </div>


      <!-- Kolom password untuk login -->

      <div class="form-group">

        <label for="loginPassword">
          Password
        </label>

        <input
          type="password"
          id="loginPassword"
          name="password"
          placeholder="Masukkan password"
          autocomplete="current-password"
          maxlength="128"
          required
        >

      </div>


      <!-- Tombol untuk mengirim data login ke backend -->

      <button
        type="submit"
        class="submit-btn"
        id="loginButton"
      >
        Masuk
      </button>


      <!-- Pemisah antara login email dan login Google -->

      <div class="google-divider">
        <span>atau masuk dengan</span>
      </div>


      <!--
        LOGIN GOOGLE USER.
        Tautan ini memanggil endpoint OAuth user.
        Endpoint tersebut harus tersedia di backend Vercel.
      -->

      <a
        href="/api/user/google/start"
        class="google-login-btn"
      >

        <!-- Ikon Google berbentuk SVG -->

        <svg
          viewBox="0 0 48 48"
          width="20"
          height="20"
          xmlns="http://www.w3.org/2000/svg"
          aria-hidden="true"
        >
          <path
            fill="#EA4335"
            d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.01 13.22l7.98 6.19C11.88 13.72 17.49 9.5 24 9.5Z"
            transform="translate(0 5)"
          />

          <path
            fill="#4285F4"
            d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.76 7.18l7.73 6C44.42 37.85 46.98 31.76 46.98 24.55Z"
            transform="translate(0 -1)"
          />

          <path
            fill="#FBBC05"
            d="M10.53 28.59A14.4 14.4 0 0 1 9.75 24c0-1.59.27-3.13.76-4.59l-7.98-6.19A23.9 23.9 0 0 0 0 24c0 3.87.93 7.52 2.53 10.78l8-6.19Z"
            transform="translate(0 -1)"
          />

          <path
            fill="#34A853"
            d="M24 48c6.48 0 11.93-2.13 15.91-5.8l-7.73-6c-2.15 1.45-4.92 2.3-8.18 2.3-6.51 0-12.12-4.22-14.11-10.06l-7.98 6.19C6.51 42.62 14.62 48 24 48Z"
            transform="translate(0 -5)"
          />
        </svg>

        <span>
          Masuk dengan Google
        </span>

      </a>

    </form>


    <!-- =======================================================
         FORMULIR PENDAFTARAN USER
         Mengirim nama, email, dan password ke
         /api/user/register. Backend wajib menetapkan role user.
    ======================================================== -->

    <form id="registerForm" hidden>

      <h2 class="form-title">
        Buat akun pengguna
      </h2>

      <p class="form-description">
        Daftar untuk menggunakan fitur pengguna.
      </p>


      <!-- Kolom nama lengkap -->

      <div class="form-group">

        <label for="registerName">
          Nama lengkap
        </label>

        <input
          type="text"
          id="registerName"
          name="name"
          placeholder="Masukkan nama lengkap"
          autocomplete="name"
          maxlength="100"
          required
        >

      </div>


      <!-- Kolom email pendaftaran -->

      <div class="form-group">

        <label for="registerEmail">
          Email
        </label>

        <input
          type="email"
          id="registerEmail"
          name="email"
          placeholder="Masukkan email"
          autocomplete="email"
          maxlength="254"
          required
        >

      </div>


      <!-- Kolom password baru -->

      <div class="form-group">

        <label for="registerPassword">
          Password
        </label>

        <input
          type="password"
          id="registerPassword"
          name="password"
          placeholder="Minimal 12 karakter"
          minlength="12"
          maxlength="128"
          autocomplete="new-password"
          required
        >

      </div>


      <!-- Kolom konfirmasi password untuk menghindari salah ketik -->

      <div class="form-group">

        <label for="confirmPassword">
          Konfirmasi password
        </label>

        <input
          type="password"
          id="confirmPassword"
          name="confirmPassword"
          placeholder="Ulangi password"
          minlength="12"
          maxlength="128"
          autocomplete="new-password"
          required
        >

      </div>


      <!-- Tombol mengirim data pendaftaran ke backend -->

      <button
        type="submit"
        class="submit-btn"
        id="registerButton"
      >
        Daftar
      </button>


      <!-- Pemisah antara pendaftaran email dan Google -->

      <div class="google-divider">
        <span>atau daftar dengan</span>
      </div>


      <!--
        PENDAFTARAN / LOGIN GOOGLE USER.
        Google OAuth dapat membuat atau menghubungkan akun,
        tergantung implementasi backend yang dibuat.
      -->

      <a
        href="/api/user/google/start"
        class="google-login-btn"
      >

        <!-- Ikon Google berbentuk SVG -->

        <svg
          viewBox="0 0 48 48"
          width="20"
          height="20"
          xmlns="http://www.w3.org/2000/svg"
          aria-hidden="true"
        >
          <path
            fill="#EA4335"
            d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.01 13.22l7.98 6.19C11.88 13.72 17.49 9.5 24 9.5Z"
            transform="translate(0 5)"
          />

          <path
            fill="#4285F4"
            d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.76 7.18l7.73 6C44.42 37.85 46.98 31.76 46.98 24.55Z"
            transform="translate(0 -1)"
          />

          <path
            fill="#FBBC05"
            d="M10.53 28.59A14.4 14.4 0 0 1 9.75 24c0-1.59.27-3.13.76-4.59l-7.98-6.19A23.9 23.9 0 0 0 0 24c0 3.87.93 7.52 2.53 10.78l8-6.19Z"
            transform="translate(0 -1)"
          />

          <path
            fill="#34A853"
            d="M24 48c6.48 0 11.93-2.13 15.91-5.8l-7.73-6c-2.15 1.45-4.92 2.3-8.18 2.3-6.51 0-12.12-4.22-14.11-10.06l-7.98 6.19C6.51 42.62 14.62 48 24 48Z"
            transform="translate(0 -5)"
          />
        </svg>

        <span>
          Daftar dengan Google
        </span>

      </a>

    </form>


    <!--
      Tempat menampilkan pesan sukses atau error.
      Contoh: password tidak sama atau login berhasil.
    -->

    <div
      class="message"
      id="message"
      role="status"
      aria-live="polite"
    ></div>


    <!-- Footer halaman -->

    <p class="footer">
      &copy; 2026 Kalkulator Harga Tayang
    </p>

  </main>


  <script>
    "use strict";


    /* =========================================================
       1. MENGAMBIL ELEMEN HALAMAN
       Variabel ini dipakai untuk mengendalikan tab, formulir,
       tombol, dan kotak pesan.
    ========================================================= */

    const loginTab = document.getElementById("loginTab");
    const registerTab = document.getElementById("registerTab");

    const loginForm = document.getElementById("loginForm");
    const registerForm = document.getElementById("registerForm");

    const message = document.getElementById("message");

    const loginButton = document.getElementById("loginButton");
    const registerButton = document.getElementById("registerButton");


    /* =========================================================
       2. BERPINDAH TAB
       Fungsi ini menampilkan formulir login atau pendaftaran.
    ========================================================= */

    function showTab(tab) {
      const isLogin = tab === "login";

      loginForm.hidden = !isLogin;
      registerForm.hidden = isLogin;

      loginTab.classList.toggle("active", isLogin);
      registerTab.classList.toggle("active", !isLogin);

      loginTab.setAttribute("aria-selected", String(isLogin));
      registerTab.setAttribute("aria-selected", String(!isLogin));

      // Hapus pesan lama saat pengguna berpindah tab.
      message.style.display = "none";
      message.textContent = "";
      message.classList.remove("success");
    }

    // Saat tombol Masuk diklik, tampilkan formulir login.
    loginTab.addEventListener("click", () => showTab("login"));

    // Saat tombol Mendaftar diklik, tampilkan formulir daftar.
    registerTab.addEventListener("click", () => showTab("register"));


    /* =========================================================
       3. MENAMPILKAN PESAN
       success = true berarti pesan ditampilkan dengan warna hijau.
       Jika false, pesan ditampilkan dengan warna merah.
    ========================================================= */

    function showMessage(text, success = false) {
      message.textContent = text;
      message.style.display = "block";
      message.classList.toggle("success", success);
    }


    /* =========================================================
       4. FUNGSI REQUEST KE BACKEND
       Mengirim data JSON ke API Vercel.
       API harus mengembalikan JSON dengan success: true
       jika permintaan berhasil.
    ========================================================= */

    
async function sendRequest(endpoint, payload) {
  let response;

  try {
    response = await fetch(endpoint, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Accept": "application/json"
      },
      credentials: "same-origin",
      cache: "no-store",
      body: JSON.stringify(payload)
    });
  } catch (error) {
    console.error("Koneksi API gagal:", error);

    throw new Error(
      "Tidak dapat terhubung ke server. Periksa koneksi internet."
    );
  }

  const responseText = await response.text();

  let data;

  try {
    data = JSON.parse(responseText);
  } catch {
    console.error(
      "Respons API bukan JSON:",
      response.status,
      responseText
    );

    throw new Error(
      `Respons server tidak valid (HTTP ${response.status}).`
    );
  }

  if (!response.ok || data.success !== true) {
    console.error("API mengembalikan error:", {
      status: response.status,
      data: data
    });

    throw new Error(
      data.message ||
      `Permintaan gagal (HTTP ${response.status}).`
    );
  }

  return data;
}
    


    /* =========================================================
       5. PENDAFTARAN USER
       Endpoint: POST /api/user/register

       Data yang dikirim:
       - name     : nama lengkap pengguna
       - email    : email pengguna
       - password : password baru

       PENTING:
       Backend harus memvalidasi data, menyimpan password dalam
       bentuk hash yang aman, dan menetapkan role "user" sendiri.
       Jangan menerima role admin dari data pendaftaran publik.
    ========================================================= */

    registerForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      const name = document
        .getElementById("registerName")
        .value
        .trim();

      const email = document
        .getElementById("registerEmail")
        .value
        .trim();

      const password = document
        .getElementById("registerPassword")
        .value;

      const confirmPassword = document
        .getElementById("confirmPassword")
        .value;


      // Validasi nama sebelum mengirim data.
      if (!name) {
        showMessage("Nama lengkap wajib diisi.");
        return;
      }

      // Validasi panjang password.
      if (password.length < 12 || password.length > 128) {
        showMessage("Password harus terdiri dari 12–128 karakter.");
        return;
      }

      // Pastikan kedua kolom password sama.
      if (password !== confirmPassword) {
        showMessage("Konfirmasi password tidak sama.");
        return;
      }


      // Nonaktifkan tombol agar tidak diklik berulang kali.
      registerButton.disabled = true;
      registerButton.textContent = "Mendaftarkan...";

      try {
        const data = await sendRequest("/api/user/login", {
          name,
          email,
          password
        });

        // Kosongkan formulir pendaftaran setelah berhasil.
        registerForm.reset();

        // Pindah ke tab login dan isikan email yang baru didaftarkan.
        showTab("login");
        document.getElementById("loginEmail").value = email;

        showMessage(
          data.message || "Pendaftaran berhasil. Silakan masuk.",
          true
        );

      } catch (error) {
        // Tampilkan pesan yang dikirim backend jika tersedia.
        showMessage(error.message || "Pendaftaran gagal.");

      } finally {
        // Aktifkan kembali tombol setelah proses selesai.
        registerButton.disabled = false;
        registerButton.textContent = "Daftar";
      }
    });


    /* =========================================================
       6. LOGIN USER
       Endpoint: POST /api/user/login

       Data yang dikirim:
       - email
       - password

       Backend harus memverifikasi kredensial dan membuat cookie
       sesi yang aman. Setelah berhasil, pengguna diarahkan ke
       /user-dashboard.html.
    ========================================================= */

    loginForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      const email = document
        .getElementById("loginEmail")
        .value
        .trim();

      const password = document
        .getElementById("loginPassword")
        .value;


      // Ubah tombol untuk menunjukkan bahwa login sedang diperiksa.
      loginButton.disabled = true;
      loginButton.textContent = "Memeriksa...";

      try {
        const data = await sendRequest("/api/user/login", {
         action: "login",
          email,
          password
        });

        showMessage(
          data.message || "Login berhasil. Mengalihkan...",
          true
        );

        // Arahkan user ke dashboard setelah API login berhasil.
        window.location.replace("/user-dashboard.html");

      } catch (error) {
        showMessage(error.message || "Login gagal.");

        // Izinkan pengguna mencoba login kembali.
        loginButton.disabled = false;
        loginButton.textContent = "Masuk";
      }
    });


    /* =========================================================
       7. MEMERIKSA SESI USER YANG SUDAH LOGIN
       Endpoint: GET /api/user/check

       Jika sesi valid dan role user adalah "user", arahkan ke
       dashboard. Endpoint check harus memverifikasi cookie sesi
       di server; jangan mempercayai role dari browser saja.
    ========================================================= */

    async function checkExistingSession() {
      try {
        const response = await fetch("/api/user/login", {
          method: "GET",

          credentials: "same-origin",
          cache: "no-store",

          headers: {
            "Accept": "application/json"
          }
        });

        // Jika sesi tidak valid atau endpoint belum tersedia,
        // biarkan formulir login tetap bisa digunakan.
        if (!response.ok) {
          return;
        }

        const data = await response.json();

        if (
          data.success === true &&
          data.user &&
          data.user.role === "user"
        ) {
          window.location.replace("/user-dashboard.html");
        }

      } catch (error) {
        // Jika pemeriksaan gagal, jangan mengunci halaman login.
      }
    }


    /* Jalankan pemeriksaan sesi saat halaman dibuka. */
    checkExistingSession();

  </script>

</body>
</html>
